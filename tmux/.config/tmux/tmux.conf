# ~/.config/tmux/tmux.conf
# Reload after editing: prefix + r

# ── Prefix ───────────────────────────────────────────────────────────────
# Ctrl-a is closer to home row than the default Ctrl-b
unbind C-b
set -g prefix C-a
bind C-a send-prefix          # press Ctrl-a twice to send it to the program

# ── General ──────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"   # true colour, so nvim themes look right
set -sg escape-time 10               # no lag after <Esc> in nvim
set -g focus-events on               # nvim autoread / gitsigns refresh on focus
set -g history-limit 50000
set -g mouse on
set -g base-index 1                  # windows start at 1 (matches the keyboard)
setw -g pane-base-index 1
set -g renumber-windows on
set -g display-time 2000

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ── Vi mode ──────────────────────────────────────────────────────────────
set -g mode-keys vi
set -g status-keys vi
bind Enter copy-mode                                  # prefix Enter = scrollback
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# ── Splits / windows (open in the current directory) ─────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Pane navigation: Ctrl-h/j/k/l, shared with nvim ──────────────────────
# If the pane runs (n)vim, pass the key through and let vim-tmux-navigator
# decide; otherwise move between tmux panes. No prefix needed.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# Ctrl-l is taken by navigation, so prefix Ctrl-l clears the shell screen
bind C-l send-keys C-l

# Prefix + h/j/k/l also works, and H/J/K/L resizes (hold to repeat)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Alt-1..9 jumps straight to a window, no prefix
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -r C-p previous-window
bind -r C-n next-window
bind Tab last-window

# ── Status bar (tokyonight-night colours, to match nvim) ─────────────────
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g status-left-length 30
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold] #S #[default] "
set -g status-right "#{?client_prefix,#[fg=#e0af68 bold]PREFIX ,}#[fg=#565f89]%H:%M "
setw -g window-status-format "#[fg=#565f89] #I:#W "
setw -g window-status-current-format "#[fg=#7aa2f7,bold] #I:#W "
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#1a1b26,fg=#7aa2f7"
setw -g mode-style "bg=#283457"
