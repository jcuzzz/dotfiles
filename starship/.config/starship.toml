"$schema" = 'https://starship.rs/config-schema.json'

# Mimics Ubuntu's default prompt (user@host:~/path$) plus git info; no Nerd
# Font needed
add_newline = false
format = "$username$hostname:$directory$git_branch$git_status$character"

[username]
show_always = true
style_user = "bold green"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = true
style = "bold green"
format = "[@$hostname]($style)"

[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = true
format = "[$path]($style)"

[git_branch]
symbol = ""
style = "purple"
format = " [\\($branch\\)]($style)"

[git_status]
style = "yellow"
format = "([$all_status$ahead_behind]($style))"

[character]
success_symbol = "\\$"
error_symbol = "[\\$](bold red)"
format = "$symbol "
