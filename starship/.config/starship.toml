"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
format = "$directory$git_branch$git_status$line_break$character"

[directory]
style = "bold cyan"
truncation_length = 1
truncation_symbol = "…/"
truncate_to_repo = false
format = "[$path]($style) "

[git_branch]
style = "bold purple"
format = "[git:$branch]($style) "

[git_status]
style = "bold yellow"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
